<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College of Health Professions Galton Board</title>
  <style>
    :root {
      --um-purple: #4a154b;
      --um-purple-dark: #370d38;
      --um-gold: #c59b27;
      --um-gold-light: #fdf8eb;
      --um-gold-border: #e6c875;
      --bg-slate: #f7f6f9;
      --card-bg: #ffffff;
      --text-main: #2b1f2d;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--um-purple);
      border-radius: 12px;
      padding: 20px 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 6px 16px rgba(74, 21, 75, 0.12);
      text-align: center;
      box-sizing: border-box;
    }

    .logo-container {
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
    }

    .logo-container img {
      max-width: 100%;
      height: auto;
      max-height: 70px;
      object-fit: contain;
    }

    h2 {
      margin: 0 0 16px 0;
      color: var(--um-purple);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
      text-align: left;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      color: var(--um-purple);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border-radius: 6px;
      border: 1.5px solid var(--um-purple);
      background: #ffffff;
      color: var(--text-main);
      box-sizing: border-box;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--um-gold);
      box-shadow: 0 0 0 2px rgba(197, 155, 39, 0.25);
    }

    button {
      width: 100%;
      background: var(--um-purple);
      color: #ffffff;
      border: 2px solid var(--um-gold);
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px 0 14px 0;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:hover:not(:disabled) {
      background: var(--um-purple-dark);
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .chart-container {
      background: #faf9fb;
      border: 1px dashed var(--um-purple);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
    }

    canvas {
      width: 100%;
      height: 140px;
      display: block;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--um-gold-light);
      border: 1px solid var(--um-gold-border);
      border-radius: 8px;
      padding: 10px 4px;
      gap: 8px 4px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 9px;
      color: var(--um-purple);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
    }

    .stat-val {
      font-size: 13px;
      font-weight: 800;
      color: var(--um-purple);
      margin-top: 2px;
    }

    .formula-box {
      margin-top: 12px;
      background: #ffffff;
      border: 1px solid var(--um-gold-border);
      border-radius: 6px;
      padding: 8px 10px;
      text-align: left;
      font-size: 10px;
      color: #4a154b;
      line-height: 1.4;
    }

    .formula-box strong {
      display: block;
      margin-bottom: 2px;
      color: var(--um-purple);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-container">
    <img src="CHP.png" alt="University of Montevallo College of Health Professions">
  </div>
  
  <h2>Galton Board Simulator</h2>

  <div class="input-grid">
    <div class="input-group">
      <label for="numObs">Obs (1–100,000)</label>
      <input type="number" id="numObs" value="5000" min="1" max="100000">
    </div>
    <div class="input-group">
      <label for="minVal">Min Value</label>
      <input type="number" id="minVal" value="1">
    </div>
    <div class="input-group">
      <label for="maxVal">Max Value</label>
      <input type="number" id="maxVal" value="100">
    </div>
  </div>

  <button type="button" id="runBtn">Run Galton Board</button>

  <div class="chart-container">
    <canvas id="distCanvas" width="460" height="140"></canvas>
  </div>

  <div class="stats-grid">
    <div class="stat-item">
      <div class="stat-label">Obs (n)</div>
      <div class="stat-val" id="statN">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Mean</div>
      <div class="stat-val" id="statMean">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Median</div>
      <div class="stat-val" id="statMed">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Mode</div>
      <div class="stat-val" id="statMode">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Range</div>
      <div class="stat-val" id="statRange">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Std Dev (s)</div>
      <div class="stat-val" id="statSD">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Skewness</div>
      <div class="stat-val" id="statSkew">-</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Kurtosis</div>
      <div class="stat-val" id="statKurt">-</div>
    </div>
  </div>

  <div class="formula-box">
    <strong>Formulas Used:</strong>
    • <em>Sample Skewness (Fisher-Pearson):</em> g₁ = [n / ((n-1)(n-2))] × Σ((x - x̄)/s)³<br>
    • <em>Sample Excess Kurtosis:</em> g₂ = [n(n+1) / ((n-1)(n-2)(n-3))] × Σ((x - x̄)/s)⁴ - [3(n-1)² / ((n-2)(n-3))]
  </div>
</div>

<script>
  var animFrameId = null;

  function runGaltonSimulation() {
    var n = parseInt(document.getElementById("numObs").value, 10);
    var min = parseInt(document.getElementById("minVal").value, 10);
    var max = parseInt(document.getElementById("maxVal").value, 10);
    var btn = document.getElementById("runBtn");

    if (isNaN(n) || n < 1 || n > 100000) {
      alert("Please enter a valid observation count between 1 and 100,000.");
      return;
    }
    if (isNaN(min) || isNaN(max)) {
      alert("Please enter valid minimum and maximum values.");
      return;
    }
    if (min >= max) {
      alert("Minimum value must be strictly less than Maximum value.");
      return;
    }

    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
    }

    btn.disabled = true;
    btn.textContent = "Dropping Balls...";

    var bins = 50;
    var finalCounts = new Int32Array(bins + 1);
    var sum = 0;
    var span = max - min;

    for (var i = 0; i < n; i++) {
      var u1 = Math.random();
      var u2 = Math.random();
      while (u1 === 0) u1 = Math.random();
      var z = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);

      var normFraction = 0.5 + (z / 6.0);
      if (normFraction < 0) normFraction = 0;
      if (normFraction > 1) normFraction = 1;

      var binIdx = Math.round(normFraction * bins);
      if (binIdx < 0) binIdx = 0;
      if (binIdx > bins) binIdx = bins;

      finalCounts[binIdx]++;
      var actualVal = min + (binIdx / bins) * span;
      sum += actualVal;
    }

    var mean = sum / n;

    // Median, Mode, Min, Max
    var median = 0;
    var runningCount = 0;
    var medianTarget = n / 2;
    var foundMed = false;

    var mode = min;
    var maxFreq = 0;
    var minValSample = null;
    var maxValSample = null;

    for (var j = 0; j <= bins; j++) {
      var freq = finalCounts[j];
      var valAtBin = min + (j / bins) * span;

      if (freq > 0) {
        if (minValSample === null) minValSample = valAtBin;
        maxValSample = valAtBin;
      }
      if (freq > maxFreq) {
        maxFreq = freq;
        mode = valAtBin;
      }
      runningCount += freq;
      if (!foundMed && runningCount >= medianTarget) {
        median = valAtBin;
        foundMed = true;
      }
    }

    // Moments for Variance, Skewness, Kurtosis
    var sumSq = 0;
    var sumCube = 0;
    var sumQuad = 0;

    for (var k = 0; k <= bins; k++) {
      var cnt = finalCounts[k];
      if (cnt > 0) {
        var v = min + (k / bins) * span;
        var diff = v - mean;
        sumSq += cnt * Math.pow(diff, 2);
        sumCube += cnt * Math.pow(diff, 3);
        sumQuad += cnt * Math.pow(diff, 4);
      }
    }

    var s2 = n > 1 ? sumSq / (n - 1) : 0;
    var s = Math.sqrt(s2);

    var skewness = "N/A";
    var excessKurtosis = "N/A";

    if (n > 2 && s > 0) {
      var g1 = (n / ((n - 1) * (n - 2))) * (sumCube / Math.pow(s, 3));
      skewness = g1.toFixed(3);
    }

    if (n > 3 && s > 0) {
      var t1 = (n * (n + 1)) / ((n - 1) * (n - 2) * (n - 3));
      var t2 = sumQuad / Math.pow(s, 4);
      var t3 = (3 * Math.pow(n - 1, 2)) / ((n - 2) * (n - 3));
      var g2 = (t1 * t2) - t3;
      excessKurtosis = g2.toFixed(3);
    }

    var displayedRange = (maxValSample - minValSample).toFixed(1);

    // 3-Second Animation Setup
    var duration = 3000; // 3 seconds
    var startTime = null;
    var canvas = document.getElementById("distCanvas");
    var ctx = canvas.getContext("2d");
    var barWidth = canvas.width / (bins + 1);

    function animate(currentTime) {
      if (!startTime) startTime = currentTime;
      var elapsed = currentTime - startTime;
      var progress = Math.min(elapsed / duration, 1.0);

      // Ease-out curve
      var easeProgress = 1 - Math.pow(1 - progress, 2);

      // Live Stats Counter
      var currentN = Math.round(n * easeProgress);
      document.getElementById("statN").textContent = currentN;
      document.getElementById("statMean").textContent = mean.toFixed(2);
      document.getElementById("statMed").textContent = median.toFixed(1);
      document.getElementById("statMode").textContent = mode.toFixed(1);
      document.getElementById("statRange").textContent = displayedRange;
      document.getElementById("statSD").textContent = n > 1 ? s.toFixed(2) : "N/A";
      document.getElementById("statSkew").textContent = skewness;
      document.getElementById("statKurt").textContent = excessKurtosis;

      // Draw Animated Bars
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#4a154b";

      for (var b = 0; b <= bins; b++) {
        if (finalCounts[b] > 0 && maxFreq > 0) {
          var targetHeight = (finalCounts[b] / maxFreq) * (canvas.height - 12);
          var animatedHeight = targetHeight * easeProgress;
          var x = b * barWidth;
          var y = canvas.height - animatedHeight;
          ctx.fillRect(x, y, Math.max(1, barWidth - 0.5), animatedHeight);
        }
      }

      if (progress < 1.0) {
        animFrameId = requestAnimationFrame(animate);
      } else {
        btn.disabled = false;
        btn.textContent = "Run Galton Board";
        animFrameId = null;
      }
    }

    animFrameId = requestAnimationFrame(animate);
  }

  document.getElementById("runBtn").onclick = runGaltonSimulation;
  runGaltonSimulation();
</script>

</body>
</html>
